<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" fill="none">
  <!-- A decorative seam. Geometry is identical between light/dark files.
       Final state is the default. The only motion is one slip and its unfolding.
       Crossing order: A covers B; B covers C; C covers A. No painted background. -->
  <defs>
    <mask id="a-under-c" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="160" style="mask-type:luminance">
      <rect width="960" height="160" fill="white"/>
      <path d="M610 44L746 88V96L610 52Z" fill="black" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    </mask>
    <mask id="b-under-a" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="160" style="mask-type:luminance">
      <rect width="960" height="160" fill="white"/>
      <path d="M500 70H752V78H500Z" fill="black" stroke="black" stroke-width="4"/>
    </mask>
    <mask id="c-under-b" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="160" style="mask-type:luminance">
      <rect width="960" height="160" fill="white"/>
      <path d="M592 88L700 38V46L592 96Z" fill="black" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <style>
    .main { stroke: #919aa5; }
    .secondary { stroke: #6e7781; }
    .inner { stroke: #8ba4bc; }
    path { vector-effect: non-scaling-stroke; stroke-width: 1.15; stroke-linejoin: miter; stroke-linecap: butt; }
    mask path { stroke-width: 4; vector-effect: none; }
    .construction path { stroke-width: 0.8; }
    text { fill: #6e7781; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; text-anchor: middle; letter-spacing: 1px; }
    .slip { opacity: 0; transform: translateY(-2.4px); }
    .unfold { opacity: 1; transform-origin: 0 70px; transform: translateY(-2.4px) scaleY(1); }
    @media (prefers-reduced-motion: no-preference) {
      .slip { animation: slip 2.4s cubic-bezier(.22,.61,.36,1) 1 both; }
      .unfold { animation: unfold 2.4s cubic-bezier(.22,.61,.36,1) 1 both; }
      @keyframes slip {
        0%, 37.5% { opacity: 1; transform: translateY(0); }
        43.75% { opacity: 1; transform: translateY(-2.4px); }
        81.25%, 100% { opacity: 0; transform: translateY(-2.4px); }
      }
      @keyframes unfold {
        0%, 37.5% { opacity: 0; transform: translateY(0) scaleY(.03); }
        43.75% { opacity: 0; transform: translateY(-2.4px) scaleY(.03); }
        81.25%, 100% { opacity: 1; transform: translateY(-2.4px) scaleY(1); }
      }
    }
  </style>
  <g id="front-seam" class="main">
    <path d="M16 70H240 M252 70H488 M764 70H944"/>
  </g>
  <g class="slip" opacity="0">
    <path class="main" d="M500 70H752"/>
  </g>
  <g class="unfold">
      <g id="construction" class="construction secondary">
        <path d="M580 102L590 97 M700 29V34 M751 95L763 99"/>
      </g>
      <g id="lower-plane">
        <path id="strip-b" class="secondary" d="M592 88L700 38V46L592 96Z" mask="url(#b-under-a)"/>
        <path id="strip-c" class="inner" d="M610 44L746 88V96L610 52Z" mask="url(#c-under-b)"/>
      </g>
      <path id="strip-a" class="main" d="M500 70H752V78H592" mask="url(#a-under-c)"/>
  </g>
  <g id="registration"><g transform="translate(96 0)"><path class="secondary" d="M0 109v5"/><text x="0" y="133">01</text></g><g transform="translate(352 0)"><path class="secondary" d="M0 109v5"/><text x="0" y="133">02</text></g><g transform="translate(608 0)"><path class="secondary" d="M0 109v5"/><text x="0" y="133">03</text></g><g transform="translate(864 0)"><path class="secondary" d="M0 109v5"/><text x="0" y="133">04</text></g></g>
</svg>
